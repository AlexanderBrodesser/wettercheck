<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WetterCheck</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1><a href="index.html">WetterCheck</a></h1>
    <form onsubmit="suchen(); return false;">
      <input type="text" id="ort" placeholder="Ort eingeben">
      <button type="submit">Suchen</button>
    </form>
  </header>

  <div class="aktuell">
    <p id="ortsname" class="grau">Linz</p>
    <p id="temperatur" class="temperatur">--°</p>
    <p id="beschreibung" class="beschreibung">Wetter wird geladen...</p>
    <p id="details" class="grau"></p>
  </div>

  <div class="box">
    <h2>Vorhersage</h2>
    <p class="grau">
      Tage: <span id="anzahl">3</span>
      <input type="range" id="tage" min="1" max="7" value="3" oninput="zeigeVorhersage()">
    </p>
    <table id="vorhersage"></table>
  </div>

  <div class="box">
    <h2>Kleidung für heute</h2>
    <ul id="kleidung"></ul>
  </div>

  <footer>
    <p>
      <a href="impressum.html">Impressum</a> |
      <a href="datenschutz.html">Datenschutz</a>
    </p>
    <p>
      Schulprojekt von Alexander Brodesser und Lukas Gruber<br>
      Wetterdaten von <a href="https://open-meteo.com/">Open-Meteo.com</a> (CC BY 4.0)
    </p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
